appId: dev.mdslide.app
productName: mdslide
directories:
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/node-pty/**
extraResources:
  - from: tools
    to: tools
  - from: electron/ptyHost.cjs
    to: pty/ptyHost.cjs
mac:
  icon: build/icon.icns   # generated from docs/media/icon.svg by scripts/make_icon.py
  category: public.app-category.productivity
  target: [dmg, zip]
  # Ad-hoc signed, not notarized. Unsigned (identity: null) leaves Electron's seal broken, and macOS calls a downloaded copy damaged.
  # Hardened runtime stays off: with an ad-hoc identity its library validation rejects Electron's own frameworks.
  identity: "-"
  hardenedRuntime: false
