name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes the usage docs (README.md, docs/, LICENSE, CLAUDE.md) to GitHub Pages with Jekyll.
# Actions are pinned to commit SHAs (version in the comment; Dependabot keeps both in sync).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Assemble the site source
        run: |
          mkdir -p _pages
          cp README.md LICENSE CLAUDE.md _pages/
          cp -R docs _pages/docs
          cp .github/pages/_config.yml _pages/
          { echo "# ADR 一覧"; echo; for f in docs/adr/*.md; do echo "- [$(sed -n '1s/^# //p' "$f")]($(basename "$f"))"; done; } > _pages/docs/adr/index.md
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with: { enablement: true }
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with: { source: ./_pages, destination: ./_site }
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with: { path: ./_site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
