name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes the site to GitHub Pages with Jekyll: the landing page (.github/pages/index.html, a single static file)
# at the root, and the usage docs (README.md → README.html, docs/, LICENSE, CLAUDE.md) next to it.
# Pages must be enabled once in the repository settings (Source: GitHub Actions); GITHUB_TOKEN cannot create the site.
# Actions are pinned to commit SHAs (version in the comment; Dependabot keeps both in sync).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble the site source
        run: |
          mkdir -p _pages
          cp LICENSE CLAUDE.md _pages/
          # jekyll-optional-front-matter leaves README.md unrendered by default; with front matter it becomes README.html.
          { printf -- '---\ntitle: mdslide の使い方\n---\n\n'; cat README.md; } > _pages/README.md
          cp -R docs _pages/docs
          mkdir -p _pages/examples && cp examples/sample-master.pptx _pages/examples/   # downloadable from the landing page
          cp .github/pages/_config.yml .github/pages/index.html _pages/
          cp scripts/install.sh _pages/   # the installer, served at https://froggugugugu.github.io/mdslide/install.sh (ADR-0022)
          { echo "# ADR 一覧"; echo; for f in docs/adr/*.md; do echo "- [$(sed -n '1s/^# //p' "$f")]($(basename "$f"))"; done; } > _pages/docs/adr/index.md
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with: { source: ./_pages, destination: ./_site }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: ./_site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
