name: ci
on: [push, pull_request]

# Least privilege for GITHUB_TOKEN. Actions are pinned to commit SHAs (version in the comment; Dependabot keeps both in sync).
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: npm ci
      - run: pip install -r requirements-dev.txt && python -m playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:py
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: coverage, path: coverage/ }
  electron-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: npm run test:e2e:electron
