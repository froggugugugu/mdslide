name: release
on:
  push:
    tags: ["v*"]

# Builds the macOS package (ad-hoc signed, not notarized) and publishes it as a GitHub Release (ADR-0027).
# build only reads the repository: dependency code never runs next to a token that can write. publish holds
# contents: write, runs no repository code, and attaches the files build verified to a draft before publishing it,
# so the release is complete when it becomes immutable.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - name: Tag must match package.json version
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$v" ] || { echo "tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }
      # Install scripts of dependencies do not run; node-pty is rebuilt for Electron explicitly (what postinstall does).
      - run: npm ci --ignore-scripts && npm run rebuild
      - run: npm run typecheck && npm test
      - run: npm run dist:mac
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - name: The app in the dmg must have an intact signature (a broken one makes macOS call the download damaged)
        run: |
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" release/*.dmg
          codesign --verify --deep --strict --verbose=2 "$mnt/mdslide.app"
          hdiutil detach "$mnt"
      - name: The installer puts the built app in place with an intact signature
        run: |
          dir="$(mktemp -d)"
          MDSLIDE_ZIP="$(ls release/*.zip)" MDSLIDE_APP_DIR="$dir" MDSLIDE_SKIP_PYTHON=1 MDSLIDE_NO_OPEN=1 bash scripts/install.sh
          codesign --verify --deep --strict "$dir/mdslide.app"
      - name: The app carries the license notices and its fuses are set (ADR-0026, ADR-0028)
        run: |
          res="release/mac-arm64/mdslide.app/Contents/Resources"
          for f in LICENSE.electron.txt LICENSES.chromium.html LICENSE.mdslide.txt THIRD_PARTY_NOTICES.md; do test -s "$res/licenses/$f"; done
          node -e '
            const { getCurrentFuseWire, FuseV1Options: F } = require("@electron/fuses");
            const off = 48, on = 49; // "0" / "1" in the fuse wire; the same values electron-builder.yml asks for
            const want = { RunAsNode: off, EnableCookieEncryption: on, EnableNodeOptionsEnvironmentVariable: off, EnableNodeCliInspectArguments: off, EnableEmbeddedAsarIntegrityValidation: on, OnlyLoadAppFromAsar: on, GrantFileProtocolExtraPrivileges: on };
            getCurrentFuseWire(process.argv[1]).then((w) => {
              const wrong = Object.entries(want).filter(([name, v]) => w[F[name]] !== v).map(([name]) => name);
              if (wrong.length) { console.error("fuses not as configured:", wrong); process.exit(1); }
            });' "release/mac-arm64/mdslide.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: mac, path: release }
      - name: Create the release as a draft with dmg / zip attached, then publish it
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env: { GH_TOKEN: "${{ github.token }}" }
