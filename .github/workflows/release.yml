name: release
on:
  push:
    tags: ["v*"]

# Builds the unsigned macOS package and attaches it to a GitHub Release.
# This is the only workflow allowed to write to the repository; ci.yml and pages.yml stay read-only on contents.
permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - name: Tag must match package.json version
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$v" ] || { echo "tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run dist:mac
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - name: Create the release with dmg / zip attached
        run: gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
