name: release
on:
  push:
    tags: ["v*"]

# Builds the macOS package (ad-hoc signed, not notarized) and attaches it to a GitHub Release.
# This is the only workflow allowed to write to the repository; ci.yml and pages.yml stay read-only on contents.
permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - name: Tag must match package.json version
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$v" ] || { echo "tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run dist:mac
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - name: The app in the dmg must have an intact signature (a broken one makes macOS call the download damaged)
        run: |
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" release/*.dmg
          codesign --verify --deep --strict --verbose=2 "$mnt/mdslide.app"
          hdiutil detach "$mnt"
      - name: Create the release with dmg / zip attached
        run: gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
