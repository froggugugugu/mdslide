# Dependencies are pinned to exact versions (package.json / requirements*.txt / action SHAs).
# Dependabot proposes updates as PRs; CI must be green before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # electron-vite 5 declares peer vite ^5 || ^6 || ^7; a vite major bump breaks `npm ci` until electron-vite follows.
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 6 requires vite 8 (see above).
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (native compiler) is evaluated separately, not through routine updates.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
